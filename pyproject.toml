[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ao-sky"
description = "Gaia-backed AO-sky mapping, guide-star loading, and asterism search"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Nelson V. Nunes", email = "nvnunes@yorku.ca"},
]
dynamic = ["version"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Astronomy",
]

[project.urls]
Homepage = "https://github.com/nvnunes/ao-sky"
Documentation = "https://github.com/nvnunes/ao-sky#readme"
Repository = "https://github.com/nvnunes/ao-sky"
Issues = "https://github.com/nvnunes/ao-sky/issues"

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8.0",
]
docs = [
    "mkdocs>=1.6.0,<2.0",
]

[project.scripts]
ao-sky = "ao_sky.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["ao_sky*"]

[tool.setuptools.dynamic]
version = {attr = "ao_sky._version.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]

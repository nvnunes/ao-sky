site_name: ao-sky
site_description: Gaia-backed AO-sky mapping and asterism search
repo_name: ao-sky
docs_dir: docs
strict: true

theme:
  name: mkdocs

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src
          options:
            show_root_heading: true
            show_source: false
            heading_level: 2
            members_order: source

nav:
  - Home: index.md
  - Guides:
      - API: api.md
      - Architecture: architecture.md
      - Algorithms: algorithms.md
      - Development: development.md
      - Testing: testing.md
      - Benchmarking: benchmarking.md
      - Plan: plan.md
  - Reference:
      - Gaia API: reference/gaia/api.md
      - Spatial API: reference/spatial/api.md
      - Asterisms API: reference/asterisms/api.md
      - Predict API: reference/predict/api.md
      - Build API: reference/build/api.md
